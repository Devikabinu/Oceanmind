# OceanMind preprocessing configuration. Every tunable lives here.
# Relative paths are resolved against the directory containing this file.

paths:
  raw_dir: data/raw                     # holds <store>_final.zarr / <store>_nrt.zarr, cache/, obis/
  out_dir: processed
  obis: obis/occurrences.parquet        # relative to raw_dir

grid:                                   # common target grid (cell centres)
  # Region 20-50N, 160W-120W, snapped inward to the native OISST cell centres (x.125 / x.375 ...) so the
  # target grid IS the source grid (identity regrid, no half-cell blur, no NaN edge rows).
  lat_min: 20.125
  lat_max: 49.875
  lon_min: -159.875
  lon_max: -120.125
  resolution: 0.25
  regrid_method: bilinear               # bilinear | conservative (conservative needs xesmf, else falls back to bilinear)
  min_weight: 0.5                       # NaN-aware bilinear: min fraction of valid neighbour weight to emit a value

time:
  reference_var: sst                    # defines the time axis and the land mask
  start: "2012-01-01"                   # null = first reference date. Raw cache holds 2000+; 2012+ keeps the cube ~2.5 GB
                                        # (disk/RAM); move earlier if you have the space.
  end: null                             # null = last reference date

raw:
  source: stores                        # stores = Zarr stores under raw_dir (NOAA OISST); provider = an EnvironmentalDataProvider (see environment_provider below)
  provider_chunk_days: 366              # source: provider only; days read from the provider per request (bounds memory)
  final_pattern: "{store}_final.zarr"
  nrt_pattern: "{store}_nrt.zarr"
  use_nrt_in_build: false               # training data: FINAL only. Inference always uses NRT where FINAL is missing.
  # scale/offset convert source units: value*scale + offset. log10 = mask <=0 then log10 (before regridding / daily mean).
  variables:
    sst: {store: sst, var: sst, scale: 1.0, offset: 0.0, log10: false}    # NOAA OISST v2.1, already degree_C
    # further variables (salinity, chlorophyll, oxygen) would be added here once a source is connected:
    # sal: {store: salinity, var: so, scale: 1.0, offset: 0.0, log10: false}
    # chl: {store: chl,      var: chl, scale: 1.0, offset: 0.0, log10: true}
    # oxy: {store: oxygen,   var: o2,  scale: 1.0, offset: 0.0, log10: false, depth: 0.0}

missing:
  max_gap_days: 3                       # time-interpolate NaN runs up to this length; longer runs stay NaN (+ mask channel)

outliers:
  percentiles: [0.1, 99.9]              # computed on TRAIN period ocean cells only
  max_samples: 5000000
  seed: 0

climatology:
  smooth_sigma_days: 7.0                # circular Gaussian smoothing over day-of-year
  variables: [sst]                      # train-only climatologies saved for these

features:
  anomaly_vars: [sst]                   # adds <var>_anom = value - climatology
  doy: true                             # doy_sin / doy_cos channels
  gradient: {enabled: true, var: sst}   # sst_grad (degC per 100 km)
  rolling: {enabled: false, vars: [sst], window: 7, min_periods: 4}   # <var>_rmean<w>, <var>_rstd<w>
  lags: {enabled: false, vars: [sst], days: [1, 2, 3]}                # <var>_lag<k>

splits:                               # inclusive dates; null start = first date, null end = latest available
  train: [null, "2023-12-31"]
  val: ["2024-01-01", "2024-12-31"]
  test: ["2025-01-01", null]

normalization:
  min_std: 1.0e-6
  check_tol: 1.0e-3                   # |mean|<tol and |std-1|<tol on normalized train

forecast:
  lookback_days: 7
  horizons: [1, 2, 3, 4, 5, 6, 7]
  target_channel: sst                 # normalized SST
  channels: all                       # "all" or an explicit list of channel names
  filter_vars: [sst]                  # missingness of these decides if a window is skipped
  max_nan_frac: 0.2                   # skip window if mean missing-ocean fraction over input+target days exceeds this
  stride: 1

anomaly:
  days: 1                             # 1 or 3 consecutive days stacked along channels
  channels: [sst_anom, mask_sst]        # extend with sal, chl, oxy (+ masks) once a source for them is connected
  filter_vars: [sst]
  max_nan_frac: 0.5
  patch_size: [32, 32]                # null = full grid
  stride: 16
  min_ocean_frac: 0.5

ingest:                                 # NOAA OISST v2.1 via ERDDAP griddap; region = grid.* above
  cache_dir: cache                      # under paths.raw_dir
  history_start: "2000-01-01"           # FINAL history to download for training (clipped to dataset start)
  history_end: null                     # null = latest FINAL day on the server
  batch_months: 12                      # months per FINAL request (~30 MB/yr for this region)
  smoke_days: 7
  recent_days: 14                       # NRT refresh window (preliminary values are revised)
  http: {timeout_s: 180, max_retries: 5, backoff_s: 2.0, max_backoff_s: 60.0}
  sst:
    var: sst
    expected_units: degree_C
    valid_range: [-3.0, 40.0]
    products:
      final: {host: "https://upwell.pfeg.noaa.gov/erddap",    dataset: ncdcOisst21Agg_LonPM180}      # ~2 weeks behind
      nrt:   {host: "https://coastwatch.pfeg.noaa.gov/erddap", dataset: ncdcOisst21NrtAgg_LonPM180}   # preliminary, ~1 day behind

biodiversity:
  enabled: true
  columns: {lat: decimalLatitude, lon: decimalLongitude, date: eventDate, species: species, dataset: datasetID}

report:
  enabled: true

model:                                  # ConvLSTM forecaster (oceanmind_model)
  hidden_channels: 32
  kernel_size: 3
  layers: 2
  head_channels: 32
  residual: true                        # predict the change from the last observed (normalised) SST map

training:
  batch_size: 2
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5                           # early stopping on VALIDATION loss
  num_workers: 0
  grad_clip: 1.0
  loss: mse                             # mse | huber
  huber_delta: 1.0
  device: auto                          # auto | cpu | cuda
  seed: 0

environment_provider:                   # environmental data source (oceanmind_environment). Swap the provider here; nothing else repeats these values.
  provider: temporary_pacific           # GENERATED development data, not observations. A real Pacific provider replaces this later.
  domain:                               # Pacific basin; longitudes are east longitude 0..360 so the domain is contiguous across the antimeridian
    lat_min: -60.0
    lat_max: 65.0
    lon_min: 100.0                      # 100E
    lon_max: 290.0                      # 70W
  resolution_deg: 1.0                   # cell size in degrees (0.5 is also practical); cell centres sit at half-steps from the domain minimum
  temporal_resolution: 1D
  time:
    start: "2012-01-01"
    end: "2026-10-15"                   # latest available timestamp of the generated record (fixed, not "today")
  seed: 20261015                        # fixes every generated field
  mask:
    source: builtin_polygons            # coarse continent polygons + non-Pacific exclusion boxes (oceanmind_environment/pacific_mask.py)

